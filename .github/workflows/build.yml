# VibeChat 桌面端——构建矩阵
# 每个平台只跑自己原生编译，不交叉编译。
# 触发: push / PR 到 main/master
# 产出: 各平台安装包上传到 Actions Artifacts + tag 推送时自动发布 Release

name: 构建 VibeChat 桌面端

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:  # 手动触发

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: deb
            artifact: VibeChat-x86_64-linux.deb

          - os: macos-latest
            target: x86_64-apple-darwin
            ext: dmg
            artifact: VibeChat-x86_64-macos.dmg

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: exe
            artifact: VibeChat-x86_64-windows.exe

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop-tauri

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 配置 Rust 稳定版
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 安装 Linux 系统依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libssl-dev

      - name: 检查 macOS 构建环境
        if: runner.os == 'macOS'
        run: |
          # Tauri 在 macOS 上无需额外系统依赖。
          which cargo

      - name: 安装 Node.js 依赖
        run: npm ci

      - name: 构建 Tauri 发布包
        run: npm run build
        env:
          # Specta / Tauri 有时会读 CI 环境变量
          CI: true

      - name: 上传 Linux 安装包
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: desktop-tauri/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: warn

      - name: 上传 macOS 安装包
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: desktop-tauri/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: warn

      - name: 上传 Windows 安装包
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: desktop-tauri/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载全部安装包
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: 创建版本发布
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          generate_release_notes: true
          name: VibeChat ${{ github.ref_name }}
          draft: false
